name: Android Release

# One-time repository secrets required for stable Android update signing:
# SUNO_KEYSTORE_BASE64, SUNO_KEYSTORE_PASSWORD, SUNO_KEY_ALIAS, SUNO_KEY_PASSWORD
# After that, publishing a GitHub Release is the only release operation needed.

on:
  release:
    types: [published]

concurrency:
  group: android-release-${{ github.event.release.tag_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUNO_KEYSTORE_PASSWORD: ${{ secrets.SUNO_KEYSTORE_PASSWORD }}
      SUNO_KEY_ALIAS: ${{ secrets.SUNO_KEY_ALIAS }}
      SUNO_KEY_PASSWORD: ${{ secrets.SUNO_KEY_PASSWORD }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-34" "build-tools;34.0.0" \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Restore release keystore
        env:
          SUNO_KEYSTORE_BASE64: ${{ secrets.SUNO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$SUNO_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SUNO_KEYSTORE_BASE64 is missing."
            exit 1
          fi
          for name in SUNO_KEYSTORE_PASSWORD SUNO_KEY_ALIAS SUNO_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ${name} is missing."
              exit 1
            fi
          done
          KEYSTORE_PATH="${RUNNER_TEMP}/suno-downloader-release.jks"
          printf '%s' "$SUNO_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "SUNO_KEYSTORE_FILE=${KEYSTORE_PATH}" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor and install native bridges
        run: npm run cap:sync

      - name: Stamp Android version from Release
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const path = 'android/app/build.gradle';
          const rawTag = process.env.RELEASE_TAG || '';
          const versionName = (rawTag.replace(/^v/i, '').replace(/[^0-9A-Za-z._+-]/g, '-').slice(0, 100) || 'release');
          const runNumber = Number(process.env.GITHUB_RUN_NUMBER);
          if (!Number.isSafeInteger(runNumber) || runNumber <= 0) {
            throw new Error(`Invalid GITHUB_RUN_NUMBER: ${process.env.GITHUB_RUN_NUMBER}`);
          }
          // Keep release builds monotonically above local/debug defaults.
          const versionCode = 100000 + runNumber;

          let source = fs.readFileSync(path, 'utf8');
          if (!/versionCode\s+\d+/.test(source) || !/versionName\s+"[^"]*"/.test(source)) {
            throw new Error('Could not locate versionCode/versionName in generated android/app/build.gradle');
          }
          source = source.replace(/versionCode\s+\d+/, `versionCode ${versionCode}`);
          source = source.replace(/versionName\s+"[^"]*"/, `versionName "${versionName}"`);
          fs.writeFileSync(path, source);
          console.log(`Android versionName=${versionName} versionCode=${versionCode}`);
          NODE

      - name: Build unsigned release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign and verify APK
        run: |
          set -euo pipefail
          mkdir -p artifacts/android
          UNSIGNED_APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi

          BUILD_TOOLS_DIR="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="${BUILD_TOOLS_DIR}/zipalign"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          if [ ! -x "$ZIPALIGN" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::zipalign/apksigner not found under ${BUILD_TOOLS_DIR}."
            exit 1
          fi

          SAFE_TAG="$(printf '%s' "$RELEASE_TAG" | tr -c 'A-Za-z0-9._-' '-')"
          ALIGNED_APK="${RUNNER_TEMP}/suno-downloader-aligned.apk"
          FINAL_APK="artifacts/android/suno-downloader-${SAFE_TAG}.apk"

          "$ZIPALIGN" -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$APKSIGNER" sign \
            --ks "$SUNO_KEYSTORE_FILE" \
            --ks-key-alias "$SUNO_KEY_ALIAS" \
            --ks-pass env:SUNO_KEYSTORE_PASSWORD \
            --key-pass env:SUNO_KEY_PASSWORD \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"
          "$APKSIGNER" verify --verbose --print-certs "$FINAL_APK"
          sha256sum "$FINAL_APK" > "${FINAL_APK}.sha256"
          ls -lh artifacts/android/

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: suno-downloader-android-${{ github.run_id }}
          path: artifacts/android/*
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to published Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: |
            artifacts/android/*.apk
            artifacts/android/*.sha256
